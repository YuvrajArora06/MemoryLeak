    <meta charset="UTF-8" />

    <title>MemoryLeak — Agent Security Lab</title>
    <script>
      // Apply the saved light/dark choice before first paint (no flash).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('memoryleak.theme') || 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>

      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
